
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">

    <title>Virifixo - YouTube Channel Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            background: #101827;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 40px auto;
            padding: 28px;
            background: #1b2638;
            border-radius: 16px;
            border: 1px solid #344258;
        }

        h1 {
            text-align: center;
            color: #65a9ff;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aab7ca;
            margin-bottom: 28px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #101827;
            border: 1px solid #40516b;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: #2879e8;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            color: #f3c969;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #101827;
            border-radius: 12px;
        }

        .profile {
            text-align: center;
            margin-bottom: 20px;
        }

        .profile img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile h2 {
            margin-bottom: 5px;
        }

        .info {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 13px 0;
            border-bottom: 1px solid #344258;
        }

        .info span:first-child {
            color: #aab7ca;
        }

        .info span:last-child {
            text-align: right;
            overflow-wrap: anywhere;
        }

        .channel-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #65a9ff;
            text-decoration: none;
        }

        .error {
            color: #ff7777 !important;
        }

        #description {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: #c5d0df;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Virifixo</h1>

    <p class="subtitle">
        YouTube Channel Verification
    </p>

    <form id="verifyForm">

        <input
            type="url"
            id="channelInput"
            placeholder="Enter YouTube channel URL"
            maxlength="300"
            required
        >

        <button type="submit" id="verifyButton">
            Verify Channel
        </button>

    </form>

    <div id="message"></div>

    <div class="result" id="result">

        <div class="profile">

            <img
                id="thumbnail"
                src=""
                alt="Channel thumbnail"
            >

            <h2 id="channelTitle"></h2>

            <p id="customUrl"></p>

        </div>

        <div class="info">
            <span>Channel ID</span>
            <span id="channelId"></span>
        </div>

        <div class="info">
            <span>Created Date</span>
            <span id="createdDate">Loading...</span>
        </div>

        <div class="info">
            <span>Subscribers</span>
            <span id="subscribers"></span>
        </div>

        <div class="info">
            <span>Videos</span>
            <span id="videoCount"></span>
        </div>

        <div class="info">
            <span>Total Views</span>
            <span id="viewCount"></span>
        </div>

        <div class="info">
            <span>Country</span>
            <span id="country"></span>
        </div>

        <p id="description"></p>

        <a
            id="channelLink"
            class="channel-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            Open YouTube Channel
        </a>

    </div>

</div>

<script>

// ======================================
// DATE FORMATTER
// ======================================

function formatChannelDate(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "Date unavailable";
    }

    let date;

    if (typeof value === "number") {

        // Support Unix timestamps in seconds or milliseconds
        date = new Date(
            value < 100000000000
                ? value * 1000
                : value
        );

    } else {

        date = new Date(String(value).trim());

    }

    if (isNaN(date.getTime())) {
        return "Date unavailable";
    }

    if (
        date.getTime() <= 0 ||
        date.getUTCFullYear() < 2005
    ) {
        return "Date unavailable";
    }

    return new Intl.DateTimeFormat("en-GB", {
        day: "2-digit",
        month: "long",
        year: "numeric",
        timeZone: "UTC"
    }).format(date);
}


// ======================================
// SAFE TEXT OUTPUT
// ======================================

function setText(id, value) {

    const element = document.getElementById(id);

    if (!element) {
        console.error("Element not found:", id);
        return;
    }

    element.textContent =
        value === null || value === undefined
            ? "Not available"
            : String(value);
}


// ======================================
// DISPLAY CHANNEL CREATION DATE
// ======================================

function displayChannelDate(channel) {

    const dateElement =
        document.getElementById("createdDate");

    if (!dateElement) {
        console.error("Created date element not found.");
        return;
    }

    const originalDate =
        channel.publishedAt ??
        channel.createdDate ??
        null;

    console.log("VIRIFIXO DATE DIAGNOSTIC:", {
        publishedAt: channel.publishedAt,
        createdDate: channel.createdDate,
        selectedDate: originalDate
    });

    dateElement.textContent =
        formatChannelDate(originalDate);
}


// ======================================
// VERIFY CHANNEL
// ======================================

document
    .getElementById("verifyForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const input =
            document.getElementById("channelInput");

        const button =
            document.getElementById("verifyButton");

        const message =
            document.getElementById("message");

        const result =
            document.getElementById("result");

        const channelUrl = input.value.trim();

        message.textContent = "Verifying channel...";

        message.classList.remove("error");

        result.style.display = "none";

        button.disabled = true;

        button.textContent = "Checking...";

        try {

            // Send verification request

            const response = await fetch("/api/verify", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    channel: channelUrl
                })

            });


            // Read server response

            const data = await response.json();

            if (!response.ok || !data.success) {

                throw new Error(
                    data.message || "Verification failed."
                );

            }


            const channel = data.channel;

            if (!channel) {
                throw new Error("Channel information is missing.");
            }


            // ======================================
            // CHANNEL INFORMATION
            // ======================================

            setText(
                "channelTitle",
                channel.title || "Unknown Channel"
            );

            setText(
                "channelId",
                channel.channelId
            );

            setText(
                "customUrl",
                channel.customUrl || "No custom URL"
            );


            // ======================================
            // ORIGINAL YOUTUBE CREATION DATE
            // ======================================

            displayChannelDate(channel);


            // ======================================
            // SUBSCRIBERS
            // ======================================

            setText(
                "subscribers",

                channel.subscriberCountHidden
                    ? "Hidden"
                    : Number(
                        channel.subscribers || 0
                    ).toLocaleString("en-US")
            );


            // ======================================
            // VIDEO COUNT
            // ======================================

            setText(
                "videoCount",

                Number(
                    channel.videoCount || 0
                ).toLocaleString("en-US")
            );


            // ======================================
            // TOTAL VIEWS
            // ======================================

            setText(
                "viewCount",

                Number(
                    channel.viewCount || 0
                ).toLocaleString("en-US")
            );


            // ======================================
            // COUNTRY
            // ======================================

            setText(
                "country",
                channel.country || "Not available"
            );


            // ======================================
            // DESCRIPTION
            // ======================================

            setText(
                "description",
                channel.description || "No description"
            );


            // ======================================
            // THUMBNAIL
            // ======================================

            const thumbnail =
                document.getElementById("thumbnail");

            if (channel.thumbnail) {

                thumbnail.src = channel.thumbnail;

                thumbnail.style.display = "inline-block";

            } else {

                thumbnail.removeAttribute("src");

                thumbnail.style.display = "none";

            }


            // ======================================
            // CHANNEL LINK
            // ======================================

            const channelLink =
                document.getElementById("channelLink");

            channelLink.href =
                channel.channelUrl ||
                "https://www.youtube.com/channel/" +
                encodeURIComponent(channel.channelId);


            // ======================================
            // SHOW RESULTS
            // ======================================

            result.style.display = "block";

            message.textContent =
                "Channel verified successfully!";


        } catch (error) {

            console.error(
                "VIRIFIXO ERROR:",
                error
            );

            message.textContent =
                error.message || "Something went wrong.";

            message.classList.add("error");


        } finally {

            button.disabled = false;

            button.textContent = "Verify Channel";

        }

    });

</script>

</body>
</html>
