
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">

    <title>Virifixo - YouTube Channel Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            background: #101827;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 40px auto;
            padding: 28px;
            background: #1b2638;
            border-radius: 16px;
            border: 1px solid #344258;
        }

        h1 {
            text-align: center;
            color: #65a9ff;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aab7ca;
            margin-bottom: 28px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #101827;
            border: 1px solid #40516b;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #65a9ff;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: #2879e8;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            color: #f3c969;
            overflow-wrap: anywhere;
        }

        .error {
            color: #ff7777 !important;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #101827;
            border-radius: 12px;
        }

        .profile {
            text-align: center;
            margin-bottom: 20px;
        }

        .profile img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile h2 {
            margin-bottom: 5px;
        }

        .info {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 13px 0;
            border-bottom: 1px solid #344258;
        }

        .info span:first-child {
            color: #aab7ca;
        }

        .info span:last-child {
            text-align: right;
            overflow-wrap: anywhere;
        }

        .channel-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #65a9ff;
            text-decoration: none;
        }

        #description {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: #c5d0df;
            line-height: 1.6;
        }

        .footer {
            text-align: center;
            color: #718198;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Virifixo</h1>

    <p class="subtitle">
        YouTube Channel & Video Verification
    </p>

    <form id="verifyForm">

        <input
            type="url"
            id="channelInput"
            placeholder="Enter YouTube channel or video URL"
            maxlength="300"
            autocomplete="url"
            required
        >

        <button type="submit" id="verifyButton">
            Verify Channel
        </button>

    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="result" id="result">

        <div class="profile">

            <img
                id="thumbnail"
                src=""
                alt="Channel thumbnail"
            >

            <h2 id="channelTitle"></h2>

            <p id="customUrl"></p>

        </div>

        <div class="info">
            <span>Channel ID</span>
            <span id="channelId"></span>
        </div>

        <div class="info">
            <span>Created Date</span>
            <span id="createdDate">Loading...</span>
        </div>

        <div class="info">
            <span>Date Source</span>
            <span id="dateSource"></span>
        </div>

        <div class="info">
            <span>Subscribers</span>
            <span id="subscribers"></span>
        </div>

        <div class="info">
            <span>Videos</span>
            <span id="videoCount"></span>
        </div>

        <div class="info">
            <span>Total Views</span>
            <span id="viewCount"></span>
        </div>

        <div class="info">
            <span>Country</span>
            <span id="country"></span>
        </div>

        <p id="description"></p>

        <a
            id="channelLink"
            class="channel-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            Open YouTube Channel
        </a>

    </div>

    <div class="footer">
        Virifixo &copy; 2026
    </div>

</div>

<script>
"use strict";

// ==========================================
// ELEMENTS
// ==========================================

const form = document.getElementById("verifyForm");

const input = document.getElementById("channelInput");

const button = document.getElementById("verifyButton");

const message = document.getElementById("message");

const result = document.getElementById("result");


// ==========================================
// YOUTUBE URL VALIDATION
// ==========================================

function validateYouTubeUrl(value) {

    try {

        const url = new URL(value);

        const host = url.hostname.toLowerCase();

        const allowedHosts = [
            "youtube.com",
            "www.youtube.com",
            "m.youtube.com",
            "youtu.be",
            "www.youtu.be"
        ];

        if (!allowedHosts.includes(host)) {
            return false;
        }

        // Short video URL
        if (host.endsWith("youtu.be")) {

            const videoId = url.pathname.split("/")[1];

            return /^[a-zA-Z0-9_-]{11}$/.test(videoId || "");

        }

        // Standard video URL
        if (url.pathname === "/watch") {

            const videoId = url.searchParams.get("v");

            return /^[a-zA-Z0-9_-]{11}$/.test(videoId || "");

        }

        // Channel handle
        if (/^\/@[a-zA-Z0-9._-]+\/?$/.test(url.pathname)) {
            return true;
        }

        // Channel ID
        if (/^\/channel\/UC[a-zA-Z0-9_-]{22}\/?$/.test(url.pathname)) {
            return true;
        }

        return false;

    } catch (error) {

        return false;

    }
}


// ==========================================
// TEXT OUTPUT
// ==========================================

function setText(id, value) {

    const element = document.getElementById(id);

    if (!element) {
        return;
    }

    element.textContent =
        value === null ||
        value === undefined ||
        value === ""
            ? "Not available"
            : String(value);
}


// ==========================================
// DATE FORMATTER
// ==========================================

function formatChannelDate(value) {

    if (!value) {
        return "Date unavailable";
    }

    const date = new Date(value);

    if (
        !Number.isFinite(date.getTime()) ||
        date.getUTCFullYear() < 2005
    ) {
        return "Date unavailable";
    }

    return new Intl.DateTimeFormat("en-GB", {

        day: "2-digit",

        month: "long",

        year: "numeric",

        timeZone: "UTC"

    }).format(date);
}


// ==========================================
// DISPLAY CHANNEL DATE
// ==========================================

function displayChannelDate(channel) {

    const originalDate =
        channel.publishedAt ??
        channel.createdDate ??
        null;

    console.log("VIRIFIXO DATE:", {
        publishedAt: channel.publishedAt,
        createdDate: channel.createdDate,
        dateSource: channel.dateSource
    });

    setText(
        "createdDate",
        formatChannelDate(originalDate)
    );

    setText(
        "dateSource",
        channel.dateSource
    );
}


// ==========================================
// DISPLAY CHANNEL INFORMATION
// ==========================================

function displayChannel(channel) {

    setText(
        "channelTitle",
        channel.title || "Unknown Channel"
    );

    setText(
        "channelId",
        channel.channelId
    );

    setText(
        "customUrl",
        channel.customUrl
    );

    // Creation date

    displayChannelDate(channel);

    // Subscribers

    setText(
        "subscribers",

        channel.subscriberCountHidden
            ? "Hidden"
            : Number(
                channel.subscribers || 0
            ).toLocaleString("en-US")
    );

    // Videos

    setText(
        "videoCount",

        Number(
            channel.videoCount || 0
        ).toLocaleString("en-US")
    );

    // Views

    setText(
        "viewCount",

        Number(
            channel.viewCount || 0
        ).toLocaleString("en-US")
    );

    // Country

    setText(
        "country",
        channel.country
    );

    // Description

    setText(
        "description",
        channel.description || "No description"
    );

    // Thumbnail

    const thumbnail =
        document.getElementById("thumbnail");

    if (channel.thumbnail) {

        thumbnail.src = channel.thumbnail;

        thumbnail.style.display = "inline-block";

    } else {

        thumbnail.removeAttribute("src");

        thumbnail.style.display = "none";

    }

    // Channel URL

    const channelLink =
        document.getElementById("channelLink");

    channelLink.href =
        channel.channelUrl ||
        "https://www.youtube.com/channel/" +
        encodeURIComponent(channel.channelId);

    // Show result

    result.style.display = "block";
}


// ==========================================
// ERROR HANDLING
// ==========================================

function showError(text) {

    message.textContent = text;

    message.classList.add("error");

    result.style.display = "none";
}


// ==========================================
// VERIFY CHANNEL OR VIDEO
// ==========================================

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const channelUrl = input.value.trim();

    // Validate URL

    if (!validateYouTubeUrl(channelUrl)) {

        showError(
            "Please enter a valid YouTube channel or video URL."
        );

        return;
    }

    // Loading

    button.disabled = true;

    button.textContent = "Checking...";

    message.classList.remove("error");

    message.textContent = "Connecting to Virifixo...";

    result.style.display = "none";

    try {

        // Send request

        const response = await fetch("/api/verify", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                channel: channelUrl
            })

        });

        // Read response

        const data = await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Verification failed. HTTP " + response.status
            );

        }

        // Get channel

        const channel = data.channel;

        if (!channel) {

            throw new Error(
                "Channel information is missing."
            );

        }

        // Display information

        displayChannel(channel);

        message.textContent =
            "Channel verified successfully!";

        message.classList.remove("error");

    } catch (error) {

        console.error(
            "VIRIFIXO ERROR:",
            error
        );

        showError(
            error.message ||
            "Unable to verify channel."
        );

    } finally {

        button.disabled = false;

        button.textContent = "Verify Channel";

    }

});

</script>

</body>
</html>
